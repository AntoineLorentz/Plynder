<svg viewBox="0 0 680 465" xmlns="http://www.w3.org/2000/svg">
<title>Plynder global architecture</title>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/>
  </marker>

  <style>
    text{font:12px system-ui,sans-serif;text-anchor:middle}
    .h{font-size:14px;font-weight:500}

    .box{rx:14;stroke-width:.5}
    .node{rx:6;stroke-width:.5}
    .sep{stroke:#9c9a92;stroke-width:.5;opacity:.5}

    /* color themes */
    .g1{fill:#085041;stroke:#5dcaA5}  .g1t{fill:#9fe1cb}
    .g2{fill:#0c447c;stroke:#85b7eb}  .g2t{fill:#b5d4f4}
    .g3{fill:#444441;stroke:#b4b2a9}  .g3t{fill:#d3d1c7}
    .g4{fill:#3c3489;stroke:#afa9ec}  .g4t{fill:#cecbf6}
    .g5{fill:#633806;stroke:#ef9f27}  .g5t{fill:#fac775}
    .g6{fill:#712b13;stroke:#f0997b}  .g6t{fill:#f5c4b3}

    .aG{stroke:#1D9E75;stroke-width:1.5;marker-end:url(#a)}
    .aP{stroke:#7F77DD;stroke-width:1.5;marker-end:url(#a)}
    .aR{stroke:#D85A30;stroke-width:1.5;marker-end:url(#a)}

    .muted{fill:#c2c0b6}
  </style>
</defs>

<!-- Rollout -->
<g>
  <rect x="10" y="58" width="165" height="348" class="box g1"/>
  <text x="92" y="84" class="h g1t">Rollout</text>
  <text x="92" y="103" fill="#5dcaA5">vLLM · ZMQ · PyArrow</text>
  <line x1="22" y1="116" x2="163" y2="116" class="sep"/>

  <rect x="22" y="126" width="141" height="44" class="node g2"/>
  <text x="92" y="148" class="h g2t">ModelReceiver</text>

  <rect x="22" y="178" width="141" height="58" class="node g2"/>
  <text x="92" y="197" class="h g2t">Worker × N</text>
  <text x="92" y="217" fill="#85b7eb">vLLM + plynder_rs</text>

  <rect x="22" y="244" width="141" height="44" class="node g3"/>
  <text x="92" y="266" class="h g3t">Sender</text>

  <rect x="22" y="296" width="141" height="44" class="node g3"/>
  <text x="92" y="318" class="h g3t">StatsPub</text>
</g>

<!-- Trainer -->
<g>
  <rect x="248" y="58" width="188" height="390" class="box g4"/>
  <text x="342" y="84" class="h g4t">Trainer</text>
  <text x="342" y="103" fill="#afa9ec">PyTorch · Accelerate · LMDB</text>
  <line x1="260" y1="116" x2="424" y2="116" class="sep"/>

  <rect x="260" y="126" width="164" height="44" class="node g3"/>
  <text x="342" y="148" class="h g3t">BatchServer</text>

  <rect x="260" y="178" width="164" height="44" class="node g5"/>
  <text x="342" y="200" class="h g5t">LMDB ring buffer</text>

  <rect x="260" y="230" width="164" height="44" class="node g3"/>
  <text x="342" y="252" class="h g3t">DataLoader</text>

  <rect x="260" y="282" width="164" height="44" class="node g4"/>
  <text x="342" y="304" class="h g4t">CISPO training loop</text>

  <rect x="260" y="334" width="164" height="58" class="node g3"/>
  <text x="342" y="354" class="h g3t">ModelSender</text>
  <text x="342" y="374" fill="#b4b2a9">&amp; StatsCollector</text>
</g>

<!-- Evaluation -->
<g>
  <rect x="506" y="58" width="164" height="228" class="box g6"/>
  <text x="588" y="84" class="h g6t">Evaluation</text>
  <text x="588" y="103" fill="#f0997b">PyTorch · python-chess</text>
  <line x1="518" y1="116" x2="658" y2="116" class="sep"/>

  <rect x="518" y="126" width="140" height="44" class="node g3"/>
  <text x="588" y="148" class="h g3t">Transformers CPU</text>

  <rect x="518" y="178" width="140" height="58" class="node g3"/>
  <text x="588" y="197" class="h g3t">Async matches</text>
  <text x="588" y="217" fill="#b4b2a9">vs weaken Stockfish</text>
</g>

<!-- Flows -->
<g class="muted">
  <line x1="175" y1="266" x2="248" y2="266" class="aG"/>
  <text x="211" y="254">samples</text>

  <line x1="248" y1="207" x2="175" y2="207" class="aP"/>
  <text x="211" y="195">model</text>

  <line x1="175" y1="318" x2="248" y2="318" class="aG"/>
  <text x="211" y="306">stats</text>

  <line x1="436" y1="165" x2="506" y2="165" class="aP"/>
  <text x="471" y="153">model</text>

  <line x1="506" y1="222" x2="436" y2="222" class="aR"/>
  <text x="471" y="210">stats</text>
</g>

</svg>