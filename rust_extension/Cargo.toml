[package]
name = "plynder_rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "High-performance chess rules engine for Plynder (PyO3 → plynder_rs)"

[lib]
name = "plynder_rs"
crate-type = ["cdylib"]

[dependencies]
ahash = "0.8.12"
bytemuck = "1.25.0"
cozy-chess = "0.3.4"
once_cell = "1.21.3"
pyo3 = { version = "0.24.2", features = ["extension-module"] }
rmp-serde = "1.3.0"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.1", features = ["rt", "rt-multi-thread", "sync"] }
zmq = "0.10.0"
tch = "=0.23"
pyo3-tch = "=0.23"
