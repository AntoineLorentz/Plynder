[project]
name = "plynder"
version = "0.1.0"
description = "Distributed chess RL: train a Qwen3 LLM to play chess with CISPO and a Rust legal-move engine."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
authors = [{ name = "antNLocks" }]
keywords = ["chess", "reinforcement-learning", "cispo", "qwen", "vllm", "rust", "pyo3"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "plynder-rs",
    "torch==2.10.0",
    "vllm==0.18.1",
    "accelerate>=1.13.0",
    "transformers==4.56.0",
    "chess>=1.11.2",
    "hydra-core>=1.3.0",
    "lmdb>=2.1.1",
    "msgpack>=1.1.1",
    "pyarrow>=23.0.1",
    "pyzmq>=27.1.0",
    "tqdm>=4.66.5",
    "mlflow>=3.11.1",
    "choix>=0.4.1",
    "flashinfer-python>=0.6.6",
    "flashinfer-cubin==0.6.6",
]

[project.urls]
Repository = "https://github.com/antNLocks/plynder"


[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ship the Rust sources in the sdist so `uv build` artifacts are complete
# (plynder-rs is a local path dependency, see [tool.uv.sources]).
source-include = ["rust_extension/src/**", "rust_extension/Cargo.toml", "rust_extension/Cargo.lock", "rust_extension/pyproject.toml"]

[tool.uv.sources]
plynder-rs = { path = "rust_extension" }

[tool.uv.extra-build-variables]
# Link the Rust extension against the torch installed in the environment.
plynder-rs = { LIBTORCH_USE_PYTORCH = "1" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TC004"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

